name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ── Job 1: Frontend (Lint + Test + Build) ─────────────────────
  frontend:
    name: Frontend — Lint, Smoke Test, Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Lint
      run: npm run lint

    - name: Smoke Tests
      run: npm test

    - name: Build
      run: npm run build
      env:
        VITE_WHATSAPP_NUMBER: ${{ secrets.VITE_WHATSAPP_NUMBER }}

  # ── Job 2: Backend (Smoke Test) ───────────────────────────────
  backend:
    name: Backend — Smoke Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install backend dependencies
      run: npm install
      working-directory: backend

    - name: Backend Smoke Tests
      run: npm test
      working-directory: backend
      env:
        NODE_ENV: test
        JWT_SECRET: ci-smoke-test-secret
